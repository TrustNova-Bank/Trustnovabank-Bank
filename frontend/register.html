<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>TrustNova Bank - Register</title>
<link
    rel="stylesheet"
    href="css/register.css"
>
</head>
<body>
<main class="register-page">
    <section class="register-card">
        <h1>Create Your Account</h1>
        <p>
            Register for your TrustNova Bank account.
        </p>
        <form id="registerForm">
            <div class="form-group">
                <label for="first_name">
                    First Name
                </label>
                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    autocomplete="given-name"
                    required
                >
            </div>
            <div class="form-group">
                <label for="last_name">
                    Last Name
                </label>
                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    autocomplete="family-name"
                    required
                >
            </div>
            <div class="form-group">
                <label for="email">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required
                >
            </div>
            <div class="form-group">
                <label for="nationality">
                    Nationality
                </label>
                <input
                    type="text"
                    id="nationality"
                    name="nationality"
                    required
                >
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>
            <button
                type="submit"
            >
                Create Account
            </button>
        </form>
        <p id="registerMessage"></p>
        <p>
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>
    </section>
</main>
<!-- Supabase JavaScript library -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>
<!-- TrustNova Supabase configuration -->
<script src="supabase.js"></script>
<!-- Customer registration -->
<script src="register.js"></script>
</body>
</html>
