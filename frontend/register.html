<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - TrustNova Bank</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<section class="login-page">


    <div class="login-box">


        <img
            src="images/logo.png"
            class="login-logo"
            alt="TrustNova Bank"
        >


        <h1>
            Create Account
        </h1>


        <p>
            Join TrustNova Bank today
        </p>


        <form id="registerForm">


            <div class="input-group">

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="First Name"
                    autocomplete="given-name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Last Name"
                    autocomplete="family-name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Phone Number"
                    autocomplete="tel"
                    required
                >

            </div>


            <div class="input-group">

                <label for="nationality">
                    Nationality
                </label>

                <input
                    type="text"
                    id="nationality"
                    name="nationality"
                    placeholder="Nationality"
                    autocomplete="country-name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>


        </form>


        <div class="register-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>


</section>


<!-- =====================================
     JAVASCRIPT
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/register.js"></script>


</body>

</html>
