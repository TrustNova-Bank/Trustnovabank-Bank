<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TrustNova Bank customer login"
    >

    <title>Login | TrustNova Bank</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >

                <img
                    src="images/logo.png"
                    alt="TrustNova Bank"
                >

                <span>
                    TrustNova Bank
                </span>

            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="register.html">
                    Register
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================
         LOGIN
    ====================================== -->

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to your TrustNova Bank account.
                </p>

            </div>


            <!-- Message area -->

            <div
                id="loginMessage"
                class="form-message"
                role="alert"
                aria-live="polite"
            ></div>



            <!-- Login form -->

            <form
                id="loginForm"
                class="auth-form"
                novalidate
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- OPTIONS -->

                <div class="form-options">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >
                    Login
                </button>


            </form>



            <!-- REGISTER -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>


        </section>

    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="site-footer">

        <p>
            &copy; 2026 TrustNova Bank.
            All rights reserved.
        </p>

    </footer>



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================
         SHARED SUPABASE CONFIGURATION
    ====================================== -->

    <script src="../shared/supabase.js"></script>


    <!-- =====================================
         CUSTOMER LOGIN
    ====================================== -->

    <script src="js/login.js"></script>


</body>

</html>
