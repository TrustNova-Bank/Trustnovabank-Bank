<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | TrustNova Bank</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<section class="login-page">


    <div class="login-box">


        <!-- TrustNova Bank Logo -->
        <img
            src="images/logo.png"
            class="login-logo"
            alt="TrustNova Bank"
        >


        <!-- Page Heading -->
        <h1>
            Forgot Password?
        </h1>


        <p>
            Enter your email address and we'll help you reset your password.
        </p>


        <!-- Password Reset Form -->
        <form id="resetForm">


            <div class="input-group">

                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
            >
                Reset Password
            </button>


        </form>


        <!-- Login Link -->
        <div class="register-link">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- Registration Link -->
        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <!-- Back Home -->
        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>


</section>


<!-- =====================================
     JAVASCRIPT
===================================== -->

<!-- Supabase Library -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- Supabase Configuration -->
<script src="js/supabase.js"></script>


<!-- Password Reset Logic -->
<script src="js/forgot-password.js"></script>


</body>

</html>
