<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transfer Money | TrustNova Bank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="dashboard-header">

    <div class="brand">

        <img
            src="images/logo.png"
            alt="TrustNova Bank"
        >

        <div>

            <h1>TrustNova Bank</h1>

            <span>Money Transfer</span>

        </div>

    </div>


    <div class="header-actions">

        <a href="dashboard.html">

            <i class="fas fa-house"></i>

            Dashboard

        </a>


        <button
            type="button"
            id="logoutButton"
        >

            <i class="fas fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</header>


<!-- ================= TRANSFER PAGE ================= -->

<main class="transfer-page">


    <section class="transfer-box">


        <!-- Heading -->

        <div class="page-heading">

            <div>

                <p class="page-label">
                    Secure Banking
                </p>

                <h1>
                    Send Money
                </h1>

                <p>
                    Transfer money securely from your TrustNova account.
                </p>

            </div>


            <div class="transfer-icon">

                <i class="fas fa-paper-plane"></i>

            </div>

        </div>


        <!-- Transfer Form -->

        <form
            id="transferForm"
            novalidate
        >


            <!-- Recipient -->

            <div class="form-section">

                <h2>
                    Recipient Information
                </h2>


                <div class="form-grid">


                    <div class="input-group">

                        <label for="recipient_name">
                            Recipient Name
                        </label>

                        <input
                            type="text"
                            id="recipient_name"
                            name="recipient_name"
                            placeholder="Enter recipient name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="account_number">
                            Account Number
                        </label>

                        <input
                            type="text"
                            id="account_number"
                            name="account_number"
                            placeholder="Enter account number"
                            inputmode="numeric"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="bank_name">
                            Bank Name
                        </label>

                        <input
                            type="text"
                            id="bank_name"
                            name="bank_name"
                            placeholder="Enter bank name"
                            required
                        >

                    </div>


                </div>

            </div>


            <!-- Amount -->

            <div class="form-section">

                <h2>
                    Transfer Details
                </h2>


                <div class="form-grid">


                    <div class="input-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="currency">
                            Currency
                        </label>

                        <select
                            id="currency"
                            name="currency"
                            required
                        >

                            <option value="">
                                Select Currency
                            </option>

                            <option value="NGN">
                                Nigerian Naira (₦)
                            </option>

                            <option value="USD">
                                US Dollar ($)
                            </option>

                            <option value="EUR">
                                Euro (€)
                            </option>

                            <option value="GBP">
                                British Pound (£)
                            </option>

                        </select>

                    </div>


                </div>


                <div class="input-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter transfer purpose"
                    ></textarea>

                </div>

            </div>


            <!-- Security Notice -->

            <div class="secure-message">

                <i class="fas fa-shield-halved"></i>

                <div>

                    <strong>
                        Secure Transfer
                    </strong>

                    <p>
                        Your transfer information is protected by
                        TrustNova security.
                    </p>

                </div>

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a
                    href="dashboard.html"
                    class="secondary-button"
                >

                    <i class="fas fa-arrow-left"></i>

                    Cancel

                </a>


                <button
                    type="submit"
                    class="primary-button"
                >

                    <i class="fas fa-paper-plane"></i>

                    Continue

                </button>

            </div>


        </form>


    </section>


</main>


<!-- ================= FOOTER ================= -->

<footer class="dashboard-footer">

    <p>
        © 2026 TrustNova Bank. All Rights Reserved.
    </p>

</footer>


<!-- ================= SCRIPTS ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="transfer.js"></script>


</body>

</html>
